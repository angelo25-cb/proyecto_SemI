data:
  raw_path: "data/raw/dataset_sintetico_demanda_lima.xlsx"
  processed_path: "data/processed/"
  results_path: "data/results/"

models:
  - name: "Random Forest"
    type: "sklearn"
    params:
      n_estimators: 484
      max_depth: 15
      min_samples_split: 2
      random_state: 42

  - name: "Gradient Boosting"
    type: "sklearn"
    params:
      n_estimators: 244
      learning_rate: 0.1039
      max_depth: 2
      random_state: 42

  - name: "XGBoost"
    type: "xgboost"
    params:
      n_estimators: 284
      learning_rate: 0.0565
      max_depth: 4
      subsample: 0.8327
      colsample_bytree: 0.9
      random_state: 42

  - name: "Prophet"
    type: "prophet"
    params:
      yearly_seasonality: true
      weekly_seasonality: true
      daily_seasonality: false

  - name: "LSTM"
    type: "tensorflow"
    params:
      epochs: 100
      batch_size: 16
      window: 14

validation:
  test_size: 0.2
  cv_folds: 5
  strategy: "TimeSeriesSplit"
  metrics:
    - MAE
    - RMSE
    - MAPE
    - R2

economic:
  unit_cost: 10.0
  selling_price: 25.0
  baseline_method: "historical_mean"