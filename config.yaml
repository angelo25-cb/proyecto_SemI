data:
  raw_path: "data/raw/dataset_sintetico_demanda_lima.xlsx"
  processed_path: "data/processed/"
  results_path: "data/results/"

models:
  - name: "Random Forest"
    type: "sklearn"
    params:
      n_estimators: 200
      max_depth: 10
  - name: "Gradient Boosting"
    type: "sklearn"
    params:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 5
  - name: "XGBoost"
    type: "xgboost"
    params:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 6
  - name: "Prophet"
    type: "prophet"
    params:
      yearly_seasonality: true
      weekly_seasonality: true
  - name: "LSTM"
    type: "tensorflow"
    params:
      epochs: 100
      batch_size: 16
      window: 7

validation:
  test_size: 0.2
  cv_folds: 5
  metrics: ["MAE", "RMSE", "MAPE"]

economic:
  unit_cost: 10.0
  selling_price: 25.0